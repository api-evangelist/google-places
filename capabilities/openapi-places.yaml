naftiko: "1.0.0-alpha2"

info:
  label: "Google Places API (New) — Places"
  description: >-
    Places — Google Places API (New). 2 operations. Lead operation: Google
    Places Get Place Details. Self-contained Naftiko capability covering one
    Google Places business surface.
  tags:
    - Google Places
    - Places
    - Details
  created: "2026-06-02"
  modified: "2026-06-02"

binds:
  - namespace: env
    keys:
      GOOGLE_PLACES_API_KEY: GOOGLE_PLACES_API_KEY

capability:

  # ── 1. Consumes — the upstream HTTP API this capability speaks to ─────
  consumes:
    - type: http
      namespace: "openapi-places"
      baseUri: "https://places.googleapis.com/v1"
      description: "Google Places API (New) — Places business capability. Self-contained, no shared references."
      authentication:
        type: apikey
        key: X-Goog-Api-Key
        value: "{{env.GOOGLE_PLACES_API_KEY}}"
        placement: header
      resources:
        - name: "place"
          path: "/places/{placeId}"
          operations:
            - name: "getPlaceDetails"
              method: GET
              description: "Retrieve comprehensive information about a specific place."
              inputParameters:
                - name: "placeId"
                  in: path
                  type: string
                  required: true
                  description: "The unique place identifier."
                - name: "X-Goog-FieldMask"
                  in: header
                  type: string
                  required: true
                  description: "Comma-separated list of place fields to return."
                - name: "languageCode"
                  in: query
                  type: string
                  required: false
                  description: "The language in which to return results."
                - name: "regionCode"
                  in: query
                  type: string
                  required: false
                  description: "The CLDR region code."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "place-photo"
          path: "/places/{placeId}/photos/{photoName}/media"
          operations:
            - name: "getPlacePhoto"
              method: GET
              description: "Retrieve a photo for a place."
              inputParameters:
                - name: "placeId"
                  in: path
                  type: string
                  required: true
                  description: "The unique place identifier."
                - name: "photoName"
                  in: path
                  type: string
                  required: true
                  description: "The photo resource reference."
                - name: "maxHeightPx"
                  in: query
                  type: integer
                  required: false
                  description: "Maximum desired height of the image in pixels."
                - name: "maxWidthPx"
                  in: query
                  type: integer
                  required: false
                  description: "Maximum desired width of the image in pixels."
                - name: "skipHttpRedirect"
                  in: query
                  type: boolean
                  required: false
                  description: "Return a JSON photo URI instead of redirecting."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  # ── 2. REST exposer — one Spectral-compliant resource per consumed op ──
  exposes:
    - type: rest
      namespace: "openapi-places-rest"
      port: 8080
      description: "REST adapter for Google Places API (New) — Places. One Spectral-compliant resource per consumed operation, prefixed with /v1."
      resources:
        - path: "/v1/places/{place-id}"
          name: "place"
          description: "REST surface for place details."
          operations:
            - method: GET
              name: "getPlaceDetails"
              description: "Retrieve comprehensive information about a specific place."
              call: "openapi-places.getPlaceDetails"
              with:
                "placeId": "rest.placeId"
                "X-Goog-FieldMask": "rest.X-Goog-FieldMask"
                "languageCode": "rest.languageCode"
                "regionCode": "rest.regionCode"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/places/{place-id}/photos/{photo-name}/media"
          name: "place-photo"
          description: "REST surface for place photo media."
          operations:
            - method: GET
              name: "getPlacePhoto"
              description: "Retrieve a photo for a place."
              call: "openapi-places.getPlacePhoto"
              with:
                "placeId": "rest.placeId"
                "photoName": "rest.photoName"
                "maxHeightPx": "rest.maxHeightPx"
                "maxWidthPx": "rest.maxWidthPx"
                "skipHttpRedirect": "rest.skipHttpRedirect"
              outputParameters:
                - type: object
                  mapping: "$."

  # ── 3. MCP exposer — one verb-noun tool per consumed op ──
    - type: mcp
      namespace: "openapi-places-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Google Places API (New) — Places. One tool per consumed operation, routed inline through this capability's consumes block."
      tools:
        - name: "get-place-details"
          description: "Retrieve comprehensive information about a specific place."
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "openapi-places.getPlaceDetails"
          with:
            "placeId": "tools.placeId"
            "X-Goog-FieldMask": "tools.X-Goog-FieldMask"
            "languageCode": "tools.languageCode"
            "regionCode": "tools.regionCode"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "get-place-photo"
          description: "Retrieve a photo for a place."
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "openapi-places.getPlacePhoto"
          with:
            "placeId": "tools.placeId"
            "photoName": "tools.photoName"
            "maxHeightPx": "tools.maxHeightPx"
            "maxWidthPx": "tools.maxWidthPx"
            "skipHttpRedirect": "tools.skipHttpRedirect"
          outputParameters:
            - type: object
              mapping: "$."
