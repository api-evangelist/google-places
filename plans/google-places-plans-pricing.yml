        geo: US
        unit: 1000
        price: '$35.00'
        userMultiplied: false
      - label: Place Details Photos
        description: Place Photos media SKU (DCD1-FE97-8C71).
        name: place_details_photos
        type: metered
        metric: request
        limit: -1
