description: >-
  Google Places API (New) is billed pay-as-you-go under the Google Maps Platform
  per-SKU pricing model, organized into Essentials, Pro, and Enterprise tiers.
  Each request type maps to a distinct SKU billed per 1,000 calls with
  volume-based discounts at higher monthly call counts. Most Essentials SKUs
  include 10,000 free calls per month; basic place data and ID-only responses are
  unlimited at no charge. The X-Goog-FieldMask header you send determines which
  SKU tier (Essentials / Pro / Enterprise) a Places request is billed at. Prices
  below are list per-1,000-call rates for US/Canada and reflect the high end of
  each volume band; verify against the live pricing page for current rates and
  your region.
sources:
  - https://developers.google.com/maps/billing-and-pricing/pricing
  - https://developers.google.com/maps/documentation/places/web-service/usage-and-billing
plans:
  - id: google-places-essentials
    name: Essentials
    type: usage-based
    description: Lowest-cost SKU tier covering Autocomplete and Place Details (Essentials field mask).
    entries:
      - label: Autocomplete Requests
        description: Per-request autocomplete predictions (Essentials SKU 4EF4-B17C-B31A).
        name: autocomplete_requests
        type: metered
        metric: request
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1000
        price: '$2.83'
        userMultiplied: false
      - label: Place Details (Essentials)
        description: Place Details with Essentials field mask (SKU 6E05-E1C3-8D85).
        name: place_details_essentials
        type: metered
        metric: request
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1000
        price: '$5.00'
        userMultiplied: false
      - label: Free Monthly Calls
        description: Most Essentials SKUs include 10,000 free events per month.
        name: free_monthly_calls
        type: quota
        metric: request
        limit: 10000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Autocomplete
      - name: Place Details (IDs Only)
      - name: Text Search (IDs Only)
      - name: Public Documentation
  - id: google-places-pro
    name: Pro
    type: usage-based
    description: Mid-tier SKUs for Nearby Search, Text Search, and Place Details (Pro field mask).
    entries:
      - label: Nearby Search
        description: Nearby Search Pro SKU (99F9-A108-83A6).
        name: nearby_search
        type: metered
        metric: request
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1000
        price: '$32.00'
        userMultiplied: false
      - label: Text Search
        description: Text Search Pro SKU (4FDA-34B1-A910).
        name: text_search
        type: metered
        metric: request
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1000
        price: '$32.00'
        userMultiplied: false
    elements:
      - name: Nearby Search
      - name: Text Search
      - name: Place Details (Pro)
  - id: google-places-enterprise
    name: Enterprise
    type: usage-based
    description: Highest-data SKUs including Atmosphere data (reviews, ratings) and Place Details Photos.
    entries:
      - label: Nearby Search (Enterprise)
        description: Nearby Search Enterprise SKU (772E-9975-BE34).
        name: nearby_search_enterprise
        type: metered
        metric: request
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1000
        price: '$35.00'
        userMultiplied: false
      - label: Text Search (Enterprise)
        description: Text Search Enterprise SKU (E967-44BC-B44D).
        name: text_search_enterprise
        type: metered
        metric: request
        limit: -1
