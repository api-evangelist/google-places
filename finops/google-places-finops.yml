specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Google Places
providerId: google-places
created: '2026-05-04'
modified: '2026-06-02'
reconciled: true
tags:
  - Geolocation
  - Google
  - Maps
  - Places
  - FinOps
  - FOCUS
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Google LLC
serviceCategory: Maps + Location
description: >-
  FOCUS-aligned FinOps for the Google Places API (New): pay-as-you-go per-SKU
  metering across Essentials, Pro, and Enterprise tiers, billed through Google
  Cloud / Google Maps Platform as usage charges with monthly free allowances on
  Essentials SKUs.
sources:
  - https://developers.google.com/maps/billing-and-pricing/pricing
  - https://developers.google.com/maps/documentation/places/web-service/usage-and-billing
  - https://cloud.google.com/billing/docs
billingModel:
  pricingCategory: Pay-As-You-Go
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Credit
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Places API
  ServiceCategory: Maps + Location
  ProviderName: Google
  PublisherName: Google LLC
  InvoiceIssuerName: Google LLC
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingUnit: 1000 calls
meters:
  - name: autocomplete_requests
    description: Autocomplete predictions billed per request (Essentials SKU).
    unit: request
    aggregation: sum
    dimensions:
      - sku
      - tier
      - region
      - project
  - name: place_details_requests
    description: Place Details requests, billed by field-mask tier (Essentials/Pro/Enterprise).
    unit: request
    aggregation: sum
    dimensions:
      - sku
      - tier
      - region
      - project
  - name: text_search_requests
    description: Text Search requests, billed at Pro or Enterprise SKU by field mask.
    unit: request
    aggregation: sum
    dimensions:
      - sku
      - tier
      - region
      - project
  - name: nearby_search_requests
    description: Nearby Search requests, billed at Pro or Enterprise SKU by field mask.
    unit: request
    aggregation: sum
    dimensions:
      - sku
      - tier
      - region
      - project
  - name: place_photo_requests
    description: Place Photos media requests (Enterprise Place Details Photos SKU).
    unit: request
    aggregation: sum
    dimensions:
      - sku
      - region
      - project
principles:
  - name: Visibility
    description: >-
      Track per-SKU Places consumption in the Google Cloud Console Maps Platform
      metrics dashboards and export detailed usage and cost via Cloud Billing
      BigQuery export.
  - name: Allocation
    description: >-
      Separate API keys and Google Cloud projects per team, environment, or
      application, and apply billing labels so Places spend is attributable in
      FOCUS-formatted billing exports.
  - name: Optimization
    description: >-
      Send the narrowest X-Goog-FieldMask that satisfies the use case to stay in
      the cheaper Essentials/Pro tier, use Autocomplete session tokens to bundle
      keystrokes plus a details call into one session, and cache Place IDs and
      basic data (which is unlimited and free) instead of re-querying.
  - name: Accountability
    description: >-
      Set per-API daily quota caps and Cloud Billing budget alerts per project,
      and assign a budget owner who reviews the monthly Maps Platform usage
      report.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
